name: story-change
version: 3
description: >
  ADD story-change schema v3. Each change workspace contains planning artifacts
  (proposal, story, design, tasks, delta specs), a runtime artifact (progress),
  and an explicit blocker gate (blocked). Every present top-level Initiative:
  header occurs exactly once; new stories require it, while bounded pre-v3
  compatibility requires zero Initiative or Initiative-like lines. A malformed
  present Initiative-like field is a conflict, never absence. Plan: and Status:
  remain independent. The exactly-once top-level Review Focus: | block is
  exclusively implementation-owned and overwritten by claim/resume on every
  handoff to IN REVIEW, including with a blank block; review reads it without
  writing it. Its body is only the immediately following indented lines and ends
  at the next top-level header. Nonblank guidance has a deterministic maximum of
  1,000 whitespace-delimited units; malformed, duplicate, conflicting, or
  over-budget forms fail closed.
  Implementation review is a readonly evaluator that returns a portable packet
  for feedback. Immediately before DONE publication, feedback runs one isolated
  fresh replay over current implementation evidence with the same evaluator
  semantics and requires semantic equivalence with the submitted packet;
  mismatch or drift is rejected and must not publish DONE. The replay is
  transient and creates no packet receipt, digest, identity, or history.
  Review receipts are not part of the current story-change
  schema; lifecycle state comes from the bound artifacts and their status.
  Implementation is gated on completed planning artifacts and tracked via
  tasks.md checkboxes.

artifacts:
  - id: proposal
    generates: proposal.md
    description: >
      Why this change, what problem it solves, goal and context. Created by
      /openspec-story-plan during the planning interview; repaired/completed by
      /openspec-story-plan-resume.
    template: proposal.md

  - id: story
    generates: story.md
    description: >
      The story contract. Its required, exactly-once top-level Initiative:
      field binds the story to one initiative; Plan: and Status: are the
      lifecycle fields. Review Focus: | is an exactly-once top-level multiline
      implementation handoff field: /openspec-story-claim and
      /openspec-story-resume exclusively overwrite it on every transition to IN
      REVIEW, including with a blank block. Its content is the immediately
      following indented lines and the next top-level header terminates it; no
      indented non-whitespace content is blank. Nonblank content is capped at
      1,000 whitespace-delimited units. Malformed, duplicate, conflicting, or
      over-budget forms fail closed. It is inert outside IN REVIEW and read-only
      to review. The body
      defines Purpose, Actors, Scenarios / Behavior Examples, Acceptance,
      Verification (including Test Architecture Plan and Acceptance Proof
      Matrix), scope, discovery, implementation guidance, and locked decisions.
      Created by /openspec-story-plan; Plan/log review is written by
      /openspec-story-plan-review; planning/scaffold repair is written by
      /openspec-story-plan-resume. /openspec-story-claim and
      /openspec-story-resume write authorized implementation Status:
      transitions; ordinary /openspec-feedback may write acknowledged
      contract/lane and reopen edits, while confirmed review-packet triage may
      publish its bounded IN PROGRESS, DONE, or BLOCKED outcome Status last after
      all canonical postconditions, including an isolated fresh evaluator replay
      immediately before DONE and semantic equivalence with the submitted packet.
      Replay mismatch or drift rejects DONE without durable packet authority.
      The readonly implementation evaluator only reads this artifact and emits a transient packet; it never writes Status,
      receipts, blockers, or timelines. A bound receiptless DONE story is an
      ordinary completed state and routes to delivery or archive rather than
      review repair.
    template: story.md

  - id: design
    generates: design.md
    description: >
      Technical design decisions, architecture rationale, and implementation
      strategy. Created by /openspec-story-plan; repaired/completed by
      /openspec-story-plan-resume; contract-changing design feedback may be
      written by /openspec-feedback. Excluded from PR bodies.
    template: design.md

  - id: tasks
    generates: tasks.md
    description: >
      Implementation task checklist with checkbox tracking. Each task is a
      concrete, verifiable unit of work. Checkbox state drives progress
      visibility via apply.tracks. Created by /openspec-story-plan;
      repaired/completed by /openspec-story-plan-resume; maintained by
      /openspec-story-claim and /openspec-story-resume; task/proof alignment may
      be updated by /openspec-feedback.
    template: tasks.md

  - id: specs
    generates: specs/**/*.md
    description: >
      Delta specs describing behavior changes. Each spec file captures the
      before/after behavioral contract for one capability domain. Created by
      /openspec-story-plan; repaired/completed by
      /openspec-story-plan-resume; archived by /opsx:archive into openspec/specs/.
    template: spec.md

  - id: progress
    generates: progress.md
    description: >
      Runtime tracking: Current Claim, Progress Timeline, Session Handoff, PR
      State, and Unresolved Debt Friction. Written by /openspec-story-claim and
      /openspec-story-resume for implementation state/timeline,
      /openspec-feedback for acknowledged replanning checkpoints, and
      /openspec-pr for PR evidence. PR State's non-review Delivery head records
      the clean current Git HEAD only after it exactly equals the live PR
      headRefOid; archive rechecks the live merged head against it. Every PR
      route first requires exactly one product repository deterministically
      resolved from Current Claim Worktrees and Primary write surfaces and a
      matching live PR head repository. Explicit no-PR archive resolves the same
      complete bounded map and performs a fresh isolated readonly delivery audit
      over every resolved product repository immediately before delegation.
      Missing or ambiguous repository bindings fail closed. Neither route persists an audit packet,
      receipt, digest, identity, or review history. This artifact is outside
      readonly implementation evaluation authority. Deprecated Implementation Review Receipt sections are
      removed from explicitly bound active workspaces by /openspec-migrate and
      are not generated by this schema. Unbound pre-v3 workspaces are excluded
      from migration because their initiative cannot be inferred safely.
      Excluded from PR bodies.
    template: progress.md

  - id: blocked
    generates: blocked.md
    description: >
      Explicit blocker gate file. When present, lifecycle gates refuse to
      continue. The sole publication-rerun exception lets confirmed
      /openspec-feedback packet triage verify exact planned existing bytes
      without rewriting before Status-last BLOCKED publication. Otherwise the
      operator removes this file to unblock; editing or annotating it may
      document resolution, but the gate remains closed while the file exists.
      Created or updated by /openspec-story-claim and
      /openspec-story-resume. Confirmed /openspec-feedback review-packet triage
      may create only an absent file whose planned final bytes are confirmed,
      treats an exact existing file as satisfied, and stops on an
      existing conflict without overwriting. Readonly implementation review
      treats it only as an input gate. A plan-review blocked verdict uses the
      Plan lane instead.
      Never auto-created during normal planning.
    template: blocked.md

apply:
  requires:
    - proposal
    - story
    - design
    - tasks
  tracks: tasks.md
  instruction: >
    Implement the tasks in tasks.md top-to-bottom. Check off each task as
    completed. Follow red-first discipline: choose the smallest focused seam,
    make it fail, turn it green, then broaden verification. Record progress
    milestones in progress.md. A bound DONE prerequisite requires exact DONE
    Status and blocker absence; receipt presence or absence does not qualify or
    disqualify it. Malformed binding or contradictory durable state still fails
    closed. Before claiming done, verify every acceptance criterion from
    story.md is satisfied and every task is checked.
